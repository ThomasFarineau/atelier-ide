[package]
name = "forge-ide"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33", features = ["persistence"] }
egui_extras = { version = "0.33", features = ["syntect", "svg", "image", "file"] }
egui_commonmark = { version = "0.22", features = ["better_syntax_highlighting", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
vt100 = "0.16"
anyhow = "1"

