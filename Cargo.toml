[package]
name = "atelier-ide"
version = "0.1.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/ThomasFarineau/atelier-ide"
default-run = "atelier-ide"

[dependencies]
eframe = { version = "0.33", features = ["persistence"] }
egui_extras = { version = "0.33", features = ["syntect", "svg", "svg_text", "image", "file"] }
# Same version as the one the diagram renderer uses: the picture of a diagram is drawn off the interface.
resvg = { version = "0.47", default-features = false, features = ["text"] }
mermaid-rs-renderer = { version = "0.3", default-features = false, features = ["png"] }
egui_commonmark = { version = "0.22", features = ["better_syntax_highlighting", "svg"] }
# The parser of egui_commonmark: where the HTML of a Markdown document is.
pulldown-cmark = { version = "0.13", default-features = false }
# The name of an installed font and whether it is monospaced.
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
vt100 = "0.16"
# The text a program of the terminal copies arrives in base64 (OSC 52).
base64 = "0.22"
anyhow = "1"
similar = "2"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
flate2 = "1"
quick-xml = "0.37"
tree-sitter = "0.27.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-rust = "0.24"
streaming-iterator = "0.1"
regex = "1"
# The bootstrap (`src/bin/atelier.rs`): downloads and updates the IDE.
ureq = "3"
sha2 = "0.10"
toml_edit = "0.22"
# Memory and processor use of the IDE, in the status bar.
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tar = { version = "0.4", default-features = false }
# The language of the system, the default language of the interface.
sys-locale = "0.3"
tree-sitter-java = "0.23"
spellbook = "0.4.2"
# The window handle eframe gives, to place the window on Windows.
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# Placement of the window on the monitor in use, its taskbar button and its crash log.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }


[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Tests: only the lines in the debug information, which links faster. The optimization stays
# the one of `dev`: at opt-level 0 the tests ran two and a half times slower.
[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = true
