name: Release

# Merging the "chore: prepare release" pull request (opened by `prepare-release.yml`) builds the
# IDE and its bootstrap, then `knope release` tags `vX.Y.Z` and publishes the GitHub release with
# the notes of CHANGELOG.md and the files. The bootstrap (`atelier`) is what users start: it finds
# the latest release by itself and updates the IDE before running it (src/bin/atelier.rs).
#
# Started by hand on `main`, it releases the version of Cargo.toml if it has no release yet
# (to finish a release whose publication failed).

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && github.head_ref == 'release')
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums of the archives the bootstrap downloads
        run: |
          cd artifacts
          sha256sum atelier-ide-* > SHA256SUMS
          cat SHA256SUMS

      - uses: knope-dev/action@v2.1.2
        with:
          version: 0.23.0

      - name: Publish
        run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
