name: Release

# Merging the "chore: prepare release" pull request (opened by `prepare-release.yml`) builds the
# IDE, its bootstrap and the native plugins, then publishes them twice:
# - in `atelier-ide-org/releases`, the public repository of the downloads, where the bootstrap
#   looks for updates (src/bin/atelier.rs). It needs the secret `RELEASES_TOKEN`, a token that
#   may write the contents of that repository;
# - here, with `knope release`, which tags `vX.Y.Z` and publishes the notes of CHANGELOG.md. The
#   bootstraps installed before the move to `releases` still look here, through the redirection
#   of `ThomasFarineau/atelier-ide`, until they update themselves (see MIGRATION.md).
# The release of `releases` is a draft until both are done: a bootstrap never sees it without
# its files.
#
# Started by hand on `main`, it releases the version of Cargo.toml if it has no release yet
# (to finish a release whose publication failed).

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && github.head_ref == 'release')
    uses: ./.github/workflows/build.yml
    # READ_TOKEN, for the submodules of the plugins.
    secrets: inherit
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums of the archives the bootstrap downloads
        run: |
          cd artifacts
          sha256sum atelier-ide-* gltf-viewer-* > SHA256SUMS
          cat SHA256SUMS

      - name: Version
        id: version
        run: echo "tag=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      # The notes of the version in CHANGELOG.md: from its title to the next one.
      - name: Draft in the repository of the downloads
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The secret RELEASES_TOKEN is missing: nothing was published."
            exit 1
          fi
          awk -v v="${TAG#v}" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          if gh release view "$TAG" --repo atelier-ide-org/releases > /dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber --repo atelier-ide-org/releases
          else
            gh release create "$TAG" artifacts/* --draft --title "$TAG" --notes-file notes.md \
              --repo atelier-ide-org/releases
          fi

      - uses: knope-dev/action@v2.1.2
        with:
          version: 0.23.0

      - name: Publish
        run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish in the repository of the downloads
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release edit "${{ steps.version.outputs.tag }}" --draft=false --latest --repo atelier-ide-org/releases
