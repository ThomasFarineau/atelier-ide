name: Prepare release

# On every push to `main` with change files in `.changeset/`, `knope prepare-release` computes the
# next version, writes CHANGELOG.md and opens (or updates) the "chore: prepare release" pull
# request from the `release` branch. Merging it starts `release.yml`.
#
# Needs "Allow GitHub Actions to create and approve pull requests" in Settings › Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prepare-release
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    # The merge of a release pull request has nothing left to prepare.
    if: "!contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Change files to release
        id: changes
        run: |
          if compgen -G ".changeset/*.md" > /dev/null; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change file in .changeset/, nothing to release."
          fi

      - name: Configure Git
        if: steps.changes.outputs.pending == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: knope-dev/action@v2.1.2
        if: steps.changes.outputs.pending == 'true'
        with:
          version: 0.23.0

      - name: Release pull request
        if: steps.changes.outputs.pending == 'true'
        run: knope prepare-release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
